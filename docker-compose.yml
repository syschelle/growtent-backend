services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: gt_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build: ./api
    container_name: gt_api
    # Drop ambient privileges and prevent writes outside the dedicated data mount.
    # Do not change the data volume ownership during an automatic upgrade.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    pids_limit: 256
    # Optional non-root mode after verifying ./data ACL/ownership on the host.
    # Default 0:0 preserves compatibility with existing installations.
    user: ${GT_API_RUN_AS:-0:0}
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # 0 disables HSTS on direct/local HTTP deployments. Prefer Traefik-managed
      # HSTS on a confirmed HTTPS-only hostname; see docs/security-deployment.md.
      GT_HSTS_MAX_AGE: ${GT_HSTS_MAX_AGE:-0}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      GO2RTC_BASE_URL: http://go2rtc:1984
      # Project files are bundled in the API image. Full repository mounts
      # (which may expose .env secrets) are intentionally NOT used by default.
      PROJECT_ROOT: /project
      STRAINS_CSV_PATH: /data/strains.csv
      INSTALL_API_ENABLED: ${INSTALL_API_ENABLED:-true}
      INSTALL_API_REQUIRE_TOKEN: ${INSTALL_API_REQUIRE_TOKEN:-true}
      INSTALL_API_TOKEN: ${INSTALL_API_TOKEN:?Set INSTALL_API_TOKEN in .env for first-run bootstrap}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Only explicitly trusted Traefik hop(s) may supply X-Forwarded-For.
      GT_TRUSTED_PROXY_CIDRS: ${GT_TRUSTED_PROXY_CIDRS:-}
      PROJECT_DOWNLOAD_ENABLED: ${PROJECT_DOWNLOAD_ENABLED:-false}
      # Mandatory in Docker: keep this key safe and OUTSIDE the database/backup.
      GT_DATA_ENCRYPTION_KEY: ${GT_DATA_ENCRYPTION_KEY:?Set GT_DATA_ENCRYPTION_KEY in .env before deployment}
    # The only host bind mount in the API is its dedicated runtime data.
    # An optional project download requires a separately reviewed, secret-free
    # checkout mounted at /project:ro (see docs/security-deployment.md).
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      go2rtc:
        condition: service_started
    ports:
      - "${GT_API_BIND_ADDRESS:-127.0.0.1}:8088:8080"

  go2rtc:
    restart: unless-stopped
    image: "${GO2RTC_IMAGE:-alexxit/go2rtc:1.9.14@sha256:f0579db234b4f9e8630493777dbf8581630d5d942d27b884ac9186f3d688e7bf}"
    container_name: gt_go2rtc
    expose:
      - "1984"
      - "8554"

volumes:
  db_data:
