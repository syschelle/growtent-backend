services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: gt_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    image: ${GT_API_IMAGE:-ghcr.io/syschelle/growtent-backend-api:v0.262}
    container_name: gt_api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      GO2RTC_BASE_URL: http://go2rtc:1984
      PROJECT_ROOT: /project
      STRAINS_CSV_PATH: /data/strains.csv
      INSTALL_API_ENABLED: ${INSTALL_API_ENABLED:-true}
      INSTALL_API_REQUIRE_TOKEN: ${INSTALL_API_REQUIRE_TOKEN:-true}
      INSTALL_API_TOKEN: ${INSTALL_API_TOKEN:?Set INSTALL_API_TOKEN in .env for first-run bootstrap}
    volumes:
      - ./:/project:ro
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      go2rtc:
        condition: service_started
    ports:
      - "8088:8080"

  go2rtc:
    restart: unless-stopped
    image: "${GO2RTC_IMAGE:-alexxit/go2rtc:1.9.14@sha256:f0579db234b4f9e8630493777dbf8581630d5d942d27b884ac9186f3d688e7bf}"
    container_name: gt_go2rtc
    expose:
      - "1984"
      - "8554"

volumes:
  db_data:
