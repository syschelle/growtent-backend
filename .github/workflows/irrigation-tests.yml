name: Backend irrigation integration tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: irrigation_test
          POSTGRES_USER: irrigation_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U irrigation_test -d irrigation_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: api
      IRRIGATION_TEST_DATABASE_URL: postgresql://irrigation_test:isolated-ci-only@localhost:5432/irrigation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r api/requirements.txt pytest
      - run: python -m compileall -q api
      - run: python -m pytest -q
