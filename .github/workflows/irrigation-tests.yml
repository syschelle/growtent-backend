name: Backend irrigation integration tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: irrigation_test
          POSTGRES_USER: irrigation_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U irrigation_test -d irrigation_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: api
      IRRIGATION_TEST_DATABASE_URL: postgresql://irrigation_test:isolated-ci-only@localhost:5432/irrigation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r api/requirements.txt pytest
      - run: python -m compileall -q api
      - run: python -m pytest -q
      - run: node tests/test_vpd_ui.mjs

  target-editor-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install fastapi==0.116.1 pytest
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: python tests/render_target_editors.py /tmp/target-editors.json
      - run: node tests/test_target_tiles_browser.cjs /tmp/target-editors.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-editor-previews
          path: layout-previews/*.png
          if-no-files-found: warn
