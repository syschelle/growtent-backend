name: Create GitHub release v0.279

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-v0279-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag_name = "v0.279";

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: tag_name });
              core.info(`Release ${tag_name} already exists.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name,
              name: "v0.279",
              body: [
                "## Shelly toggle response normalization",
                "",
                "- Normalized Shelly toggle responses for `main`, `light`, `humidifier`, `heater`, `fan` and `exhaust`.",
                "- Proxied Shelly devices now expose controller response fields under `state`, including `state.isOn`.",
                "- Backend `ok` now becomes `false` when the controller response reports `response.ok == false`.",
                "- Updated application version, About summary, changelogs and image references to `v0.279`."
              ].join("\n"),
              draft: false,
              prerelease: false
            });
